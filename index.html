<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>qpr-k</title>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.4.0/css/all.min.css">
    <style>
        :root {
            --purple-glow: rgba(188, 19, 254, 0.18);
            --gold-glow: rgba(255, 204, 0, 0.15);
            --grid-color: rgba(255, 255, 255, 0.05);
            --accent-purple: #8a2be2;
            --accent-gold: #ffd700;
        }

        ::-webkit-scrollbar {
            width: 8px;
        }

        ::-webkit-scrollbar-track {
            background: #000;
        }

        ::-webkit-scrollbar-thumb {
            background: linear-gradient(to bottom, var(--accent-purple), var(--accent-gold));
            border-radius: 10px;
        }

        body {
            margin: 0;
            padding: 0;
            background-color: #000;
            background-image: 
                linear-gradient(var(--grid-color) 1px, transparent 1px),
                linear-gradient(90deg, var(--grid-color) 1px, transparent 1px),
                radial-gradient(circle at 15% 15%, var(--purple-glow) 0%, transparent 45%),
                radial-gradient(circle at 85% 85%, var(--gold-glow) 0%, transparent 45%);
            background-size: 35px 35px, 35px 35px, 100% 100%, 100% 100%;
            background-attachment: fixed;
            color: #fff;
            font-family: 'Inter', -apple-system, system-ui, sans-serif;
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            overflow-x: hidden;
            cursor: none;
        }

        #custom-cursor {
            position: fixed;
            top: 0;
            left: 0;
            width: 28px;
            height: 28px;
            pointer-events: none;
            z-index: 9999;
            filter: drop-shadow(0 0 8px var(--accent-purple));
            display: flex;
            align-items: center;
            justify-content: center;
            transform-origin: center center;
            will-change: transform, left, top;
        }

        #cursor-svg {
            width: 100%;
            height: 100%;
            fill: none;
            stroke: var(--accent-purple);
            stroke-width: 2;
            stroke-linecap: round;
            stroke-linejoin: round;
            transition: stroke 0.3s ease;
        }

        #custom-cursor.hovering #cursor-svg {
            stroke: var(--accent-gold);
        }

        #custom-cursor.hovering {
            filter: drop-shadow(0 0 12px var(--accent-gold));
        }

        .container {
            width: 90%;
            max-width: 1000px;
            padding: 10px 0;
        }

        header {
            margin-bottom: 30px;
            display: flex;
            justify-content: space-between;
            align-items: center;
            flex-wrap: wrap;
            gap: 20px;
        }

        .title-group { flex: 1; }

        h1 {
            font-size: clamp(3rem, 10vw, 7rem);
            font-weight: 900;
            margin: 0;
            line-height: 0.8;
            text-transform: uppercase;
            letter-spacing: -4px;
        }

        .github-link {
            position: relative;
            display: flex;
            align-items: center;
            justify-content: center;
            width: 80px;
            height: 80px;
            border-radius: 50%;
            background: rgba(255, 255, 255, 0.03);
            color: #fff;
            font-size: 2.5rem;
            text-decoration: none;
            transition: transform 0.3s ease, box-shadow 0.3s ease;
            cursor: none;
            box-sizing: border-box;
        }

        .github-link::before {
            content: "";
            position: absolute;
            inset: 0;
            border-radius: 50%;
            padding: 2px; 
            background: rgba(255, 255, 255, 0.1);
            -webkit-mask: linear-gradient(#fff 0 0) content-box, linear-gradient(#fff 0 0);
            -webkit-mask-composite: xor;
            mask-composite: exclude;
            transition: background 0.3s ease;
        }

        .github-link i {
            transition: background 0.3s ease, color 0.3s ease;
            background: none;
            -webkit-background-clip: unset;
            -webkit-text-fill-color: unset;
        }

        .github-link:hover {
            transform: scale(1.05);
            box-shadow: 0 0 20px rgba(188, 19, 254, 0.2), 0 0 20px rgba(255, 204, 0, 0.15);
        }

        .github-link:hover::before {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
        }

        .github-link:hover i {
            background: linear-gradient(135deg, var(--accent-purple), var(--accent-gold));
            -webkit-background-clip: text;
            -webkit-text-fill-color: transparent;
        }

        .row {
            padding: 20px 0;
            border-top: 1px solid rgba(255, 255, 255, 0.1);
        }

        h2 {
            font-size: 0.65rem;
            text-transform: uppercase;
            letter-spacing: 4px;
            color: rgba(255, 255, 255, 0.3);
            margin-bottom: 20px;
        }

        .conveyer-belt { 
            overflow: hidden; 
            white-space: nowrap; 
            width: 100%; 
            display: flex;
        }
        
        .belt-track { 
            display: flex; 
            gap: 80px; 
            padding-right: 80px;
            animation: scroll 25s linear infinite; 
            flex-shrink: 0;
        }

        @keyframes scroll { 
            from { transform: translateX(0); } 
            to { transform: translateX(-100%); } 
        }
        
        .lang-item { 
            display: flex; 
            align-items: center; 
            gap: 15px; 
            font-size: 1.5rem; 
            font-weight: 800; 
            opacity: 0.9; 
            letter-spacing: 2px;
        }
        
        .lang-item i { font-size: 2.2rem; }

        .project-flex { display: flex; flex-direction: row; flex-wrap: wrap; gap: 40px; align-items: baseline; }
        .project-link { text-decoration: none; color: #fff; font-size: clamp(1.2rem, 4vw, 1.8rem); font-weight: 300; transition: 0.3s; white-space: nowrap; cursor: none; }
        .project-link:hover { transform: translateY(-3px); opacity: 0.7; }
        .heavy { font-weight: 900; }

        #popup {
            visibility: hidden;
            position: fixed;
            bottom: 40px;
            left: 50%;
            transform: translateX(-50%);
            background: #fff;
            color: #000;
            padding: 12px 24px;
            font-weight: 800;
            font-size: 0.7rem;
            border-radius: 2px;
            z-index: 100;
        }
        #popup.show { visibility: visible; }

        @media (max-width: 600px) {
            header { justify-content: center; text-align: center; }
            .github-link { width: 65px; height: 65px; font-size: 2rem; }
            #custom-cursor { display: none; }
            body { cursor: auto; }
            .lang-item { font-size: 1.1rem; }
            .lang-item i { font-size: 1.6rem; }
            .belt-track { gap: 40px; padding-right: 40px; }
        }
    </style>
</head>
<body>

    <div id="custom-cursor">
        <svg id="cursor-svg" viewBox="0 0 24 24">
            <path d="M4.037 4.437l15.757 9.117a.5.5 0 0 1-.007.864l-5.999 3.514a.5.5 0 0 0-.182.205l-3.473 6.287a.5.5 0 0 1-.88-.006L4.002 4.932a.5.5 0 0 1 .035-.495z"></path>
        </svg>
    </div>

    <div class="container">
        <header>
            <div class="title-group">
                <h1>qpr-k</h1>
            </div>
            
            <a href="https://github.com/qpr-k" target="_blank" class="github-link">
                <i class="fa-brands fa-github"></i>
            </a>
        </header>

        <div class="row">
            <h2>MY LANGUAGES</h2>
            <div class="conveyer-belt">
                <div class="belt-track">
                    <div class="lang-item"><i class="fa-brands fa-html5"></i> HTML</div>
                    <div class="lang-item"><i class="fa-brands fa-css3-alt"></i> CSS</div>
                    <div class="lang-item"><i class="fa-brands fa-js"></i> JAVASCRIPT</div>
                    <div class="lang-item"><i class="fa-brands fa-node-js"></i> NODEJS</div>
                    <div class="lang-item"><i class="fa-brands fa-python"></i> PYTHON</div>
                    <div class="lang-item"><i class="fa-solid fa-seedling"></i> ELM</div>
                    <div class="lang-item"><i class="fa-solid fa-leaf"></i> MINT</div>
                </div>
                <div class="belt-track" aria-hidden="true">
                    <div class="lang-item"><i class="fa-brands fa-html5"></i> HTML</div>
                    <div class="lang-item"><i class="fa-brands fa-css3-alt"></i> CSS</div>
                    <div class="lang-item"><i class="fa-brands fa-js"></i> JAVASCRIPT</div>
                    <div class="lang-item"><i class="fa-brands fa-node-js"></i> NODEJS</div>
                    <div class="lang-item"><i class="fa-brands fa-python"></i> PYTHON</div>
                    <div class="lang-item"><i class="fa-solid fa-seedling"></i> ELM</div>
                    <div class="lang-item"><i class="fa-solid fa-leaf"></i> MINT</div>
                </div>
            </div>
        </div>

        <div class="row">
            <h2>MY CURRENT PROJECTS</h2>
            <div class="project-flex">
                <a href="https://use-vela.vercel.app/" class="project-link"><span class="heavy">V</span>ELA</a>
            </div>
        </div>
    </div>

    <script>
        const cursor = document.getElementById('custom-cursor');
        let mouseX = 0, mouseY = 0;
        let cursorX = 0, cursorY = 0;
        let angle = 0;
        let isHovering = false;

        window.addEventListener('mousemove', (e) => {
            mouseX = e.clientX;
            mouseY = e.clientY;
        });

        function animateCursor() {
            let distX = mouseX - cursorX;
            let distY = mouseY - cursorY;
            
            cursorX = cursorX + (distX * 0.15);
            cursorY = cursorY + (distY * 0.15);

            if (Math.abs(distX) > 0.1 || Math.abs(distY) > 0.1) {
                angle = Math.atan2(distY, distX) * (180 / Math.PI);
            }

            let scale = isHovering ? 1.4 : 1;
            
            cursor.style.left = cursorX + 'px';
            cursor.style.top = cursorY + 'px';
            cursor.style.transform = `translate(-50%, -50%) rotate(${angle}deg) scale(${scale})`;
            
            requestAnimationFrame(animateCursor);
        }
        animateCursor();

        document.querySelectorAll('a, .project-link, .github-link').forEach(link => {
            link.addEventListener('mouseenter', () => {
                isHovering = true;
                cursor.classList.add('hovering');
            });
            link.addEventListener('mouseleave', () => {
                isHovering = false;
                cursor.classList.remove('hovering');
            });
        });

        function notify() {
            const pop = document.getElementById('popup');
            pop.className = "show";
            setTimeout(() => { pop.className = pop.className.replace("show", ""); }, 2500);
        }
    </script>
</body>
</html>
